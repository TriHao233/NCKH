services:
  backend:
    image: nckh-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nckh-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      # Ánh xạ thư mục data để không bị mất dữ liệu VectorDB (Chroma) và file tải lên
      - ./backend/data:/app/data
      # Cache mô hình HuggingFace (bge-m3) để không phải tải lại mỗi lần chạy docker
      - huggingface_cache:/root/.cache/huggingface
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REQUIRE_MONGO_TRANSACTIONS: "true"
      FIREBASE_CREDENTIALS_PATH: /app/firebase-service-account.json
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ANONYMIZED_TELEMETRY: "false"
      OLLAMA_GENERATE_URL: ${OLLAMA_GENERATE_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      EASYOCR_GPU: ${EASYOCR_GPU:-true}
      EASYOCR_LANGUAGES: ${EASYOCR_LANGUAGES:-vi,en}
      EASYOCR_BATCH_SIZE: ${EASYOCR_BATCH_SIZE:-2}
      EASYOCR_MODEL_STORAGE_DIRECTORY: /app/data/easyocr_models
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # BỎ COMMENT ĐOẠN DƯỚI ĐÂY NẾU CHẠY BẰNG GPU (NVIDIA)
    # VÀ ĐÃ CÀI ĐẶT NVIDIA CONTAINER TOOLKIT
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: nckh-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    logging: &service-logging
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: nckh-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nckh-worker
    volumes:
      - ./backend/.env:/app/.env
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
      - ./backend/data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    command: ["python", "-m", "workers.run"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=rs0
      REQUIRE_MONGO_TRANSACTIONS: "true"
      FIREBASE_CREDENTIALS_PATH: /app/firebase-service-account.json
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ANONYMIZED_TELEMETRY: "false"
      OLLAMA_GENERATE_URL: ${OLLAMA_GENERATE_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    logging: *service-logging

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
        VITE_PIPELINE_3D: ${VITE_PIPELINE_3D:-false}
    container_name: nckh-frontend
    ports:
      - "80:80" # Publish web frontend ra cổng 80 (truy cập bằng http://localhost)
    depends_on:
      - backend
    restart: unless-stopped
    logging: *service-logging

volumes:
  mongodb_data:
  huggingface_cache:
