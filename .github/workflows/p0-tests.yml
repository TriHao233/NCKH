name: P0 Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend schema and workflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(--extra-index-url|torch==|torchvision==|torchaudio==)' requirements.txt > /tmp/backend-requirements-ci.txt
          python -m pip install -r /tmp/backend-requirements-ci.txt

      - name: Run backend P0 tests
        run: python -m pytest tests/test_schema_v2.py -q

  frontend:
    name: Frontend permission and utility tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
