name: P0 Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

jobs:
  backend:
    name: Backend schema and workflow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(--extra-index-url|torch==|torchvision==|torchaudio==)' requirements.txt > /tmp/backend-requirements-ci.txt
          python -m pip install -r /tmp/backend-requirements-ci.txt

      - name: Lint backend
        run: python -m ruff check core modules workers tests

      - name: Run backend test suite
        run: >-
          python -m pytest
          tests/test_schema_v2.py
          tests/test_generation_postprocessing.py
          tests/test_generation_api.py
          tests/test_infrastructure.py
          tests/test_llm_integration.py
          -q

      - name: Start MongoDB replica set
        run: docker run --name nckh-ci-mongo -d -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all

      - name: Initialize MongoDB replica set
        run: |
          for attempt in {1..30}; do
            if docker exec nckh-ci-mongo mongosh --quiet --eval "try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          docker logs nckh-ci-mongo
          exit 1

      - name: Run MongoDB integration tests
        env:
          RUN_MONGO_INTEGRATION: "1"
          APP_ENV: test
          MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
          AUTH_DB_NAME: NCKH_ci_auth
          RAG_DB_NAME: NCKH_ci_rag
          REQUIRE_MONGO_TRANSACTIONS: "true"
        run: python -m pytest tests/test_mongo_integration.py -q

  frontend:
    name: Frontend permission and utility tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
