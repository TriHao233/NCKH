server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;
    # Docker may assign the backend a new IP whenever its container is recreated.
    # Resolve the service name at request time instead of keeping Nginx's startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Nén Gzip để tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Hỗ trợ React Router: nếu không tìm thấy file, trả về index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API tới backend (không bắt buộc nếu Frontend gọi thẳng ra ngoài, 
    # nhưng rất hữu ích nếu muốn tránh lỗi CORS trên server thực)
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        send_timeout 3600;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
