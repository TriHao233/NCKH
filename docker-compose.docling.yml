# Compatibility overlay for older commands; Docling is now enabled in docker-compose.yml.
# Uses Docker Desktop's existing storage location, including the default C drive.
services:
  backend:
    image: nckh-backend:docling
    environment: &docling-client
      PDF_OCR_ENGINE: docling
      DOCLING_URL: http://docling:5001
      DOCLING_OCR_PRESET: tesseract
      DOCLING_OCR_LANGUAGES: vie
      DOCLING_TIMEOUT: "1200"
    depends_on:
      docling:
        condition: service_healthy

  worker:
    image: nckh-backend:docling
    environment: *docling-client
    depends_on:
      docling:
        condition: service_healthy

  docling:
    image: nckh-docling-vie:dev-pinned
    build:
      context: ./backend
      dockerfile: Docling.Dockerfile
    container_name: nckh-docling
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      # Keep Docling off the GPU used by question-generation models.
      DOCLING_DEVICE: cpu
      DOCLING_NUM_THREADS: "4"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      HF_HOME: /var/cache/docling/huggingface
      XDG_CACHE_HOME: /var/cache/docling
      TMPDIR: /var/cache/docling/tmp
      DOCLING_SERVE_SCRATCH_PATH: /var/cache/docling/scratch
      DOCLING_SERVE_OCR_BATCH_SIZE: "4"
      DOCLING_SERVE_LAYOUT_BATCH_SIZE: "4"
      DOCLING_SERVE_TABLE_BATCH_SIZE: "4"
      DOCLING_SERVE_BATCH_POLLING_INTERVAL_SECONDS: "0.1"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_ALLOW_CUSTOM_OCR_CONFIG: "false"
    volumes:
      - docling_cache:/var/cache/docling
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 20
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  docling_cache:
